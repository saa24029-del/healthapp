<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヘルスケア トラッカー - 健康管理アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        health: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between antialiased">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <i class="fa-solid fa-heart-pulse text-xl"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-800">HealthLog</span>
            </div>
            
            <div id="user-profile-area" class="hidden items-center gap-3">
                <img id="user-photo" class="w-9 h-9 rounded-full ring-2 ring-emerald-500/30 object-cover" src="" alt="ユーザー">
                <span id="user-name" class="font-medium text-sm hidden sm:inline text-slate-700"></span>
                <button id="logout-btn" class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1.5 border border-slate-300">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>ログアウト</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full">
        <section id="login-screen" class="max-w-md mx-auto my-12 fade-in">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 text-center space-y-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                    <i class="fa-solid fa-notes-medical text-3xl"></i>
                </div>
                <div class="space-y-2">
                    <h1 class="text-2xl font-bold text-slate-800">毎日の健康をきろくする</h1>
                    <p class="text-slate-500 text-sm">Googleアカウントでログインして、体温や睡眠時間、体調の変化をスマートに管理しましょう。</p>
                </div>

                <div class="pt-4">
                    <button id="google-login-btn" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl border border-slate-300 shadow-sm flex items-center justify-center gap-3 transition-all transform active:scale-98">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Googleでログイン</span>
                    </button>
                </div>

                <div class="text-xs text-slate-400 pt-2">
                    <p>安全なデータ保護のため、ログインが必要です。</p>
                </div>
            </div>
        </section>

        <section id="app-screen" class="hidden space-y-8 fade-in">
            <!-- Summary Dashboard Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="p-3 bg-red-50 text-red-500 rounded-lg">
                        <i class="fa-solid fa-temperature-half text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">平均体温</div>
                        <div id="stat-temp" class="text-xl font-bold text-slate-800">-- <span class="text-xs font-normal">℃</span></div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="p-3 bg-indigo-50 text-indigo-500 rounded-lg">
                        <i class="fa-solid fa-bed text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">平均睡眠時間</div>
                        <div id="stat-sleep" class="text-xl font-bold text-slate-800">-- <span class="text-xs font-normal">時間</span></div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="p-3 bg-emerald-50 text-emerald-500 rounded-lg">
                        <i class="fa-solid fa-calendar-check text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">総記録日数</div>
                        <div id="stat-count" class="text-xl font-bold text-slate-800">0 <span class="text-xs font-normal">日</span></div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="p-3 bg-amber-50 text-amber-500 rounded-lg">
                        <i class="fa-solid fa-face-smile text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">直近の体調</div>
                        <div id="stat-condition" class="text-sm font-bold text-slate-800">データなし</div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- Record Entry Form -->
                <div class="lg:col-span-5">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5 sticky top-24">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                                <span>本日の体調を入力</span>
                            </h2>
                        </div>

                        <form id="health-form" class="space-y-4">
                            <!-- 1. 日付 -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">日付</label>
                                <div class="relative">
                                    <input type="date" id="input-date" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <!-- 2. 体温 -->
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">体温 (℃)</label>
                                    <input type="number" id="input-temp" step="0.1" min="30.0" max="43.0" placeholder="36.5" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition">
                                </div>

                                <!-- 3. 睡眠時間 -->
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">睡眠時間 (時間)</label>
                                    <input type="number" id="input-sleep" step="0.5" min="0" max="24" placeholder="7.5" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition">
                                </div>
                            </div>

                            <!-- 4. 体調 -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">体調</label>
                                <select id="input-condition" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition bg-white">
                                    <option value="絶好調">🌟 絶好調</option>
                                    <option value="良い" selected>😊 良い</option>
                                    <option value="ふつう">😐 ふつう</option>
                                    <option value="悪い">😟 悪い</option>
                                    <option value="非常につらい">😫 非常につらい</option>
                                </select>
                            </div>

                            <!-- 5. メモ -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
                                <textarea id="input-memo" rows="3" placeholder="症状、服薬、運動や一日の感想など..." class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition resize-none"></textarea>
                            </div>

                            <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition active:scale-98">
                                <i class="fa-solid fa-plus-circle"></i>
                                <span>記録を登録する</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- History Display List -->
                <div class="lg:col-span-7 space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-clock-rotate-left text-emerald-600"></i>
                            <span>記録一覧</span>
                        </h2>
                        <span id="record-count-badge" class="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-medium">0件</span>
                    </div>

                    <div id="records-list" class="space-y-3">
                        <!-- Dynamic items loaded here -->
                        <div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-200">
                            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-500"></i>
                            <p class="text-sm">データを読み込んでいます...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-400 text-xs">
        <p>&copy; 2026 HealthLog App. All rights reserved.</p>
    </footer>

    <div id="delete-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-100 fade-in">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                    <i class="fa-solid fa-trash-can text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800">記録を削除しますか？</h3>
                <p class="text-xs text-slate-500">この操作は取り消すことができません。</p>
            </div>
            <div class="flex gap-3">
                <button id="cancel-delete-btn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition">キャンセル</button>
                <button id="confirm-delete-btn" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold transition shadow-md shadow-red-600/20">削除する</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDWLHqOvge8BgJxXLdGFzEHTJuPwNMXi6g",
            authDomain: "tuisi2.firebaseapp.com",
            projectId: "tuisi2",
            storageBucket: "tuisi2.firebasestorage.app",
            messagingSenderId: "768284823178",
            appId: "1:768284823178:web:7cf7598c5b02ec7c00e773"
        };

        // App System Context
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tuisi2-health-app';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // State Variables
        let currentUser = null;
        let unsubscribeRecords = null;
        let targetDeleteId = null;

        // UI Element References
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const userProfileArea = document.getElementById('user-profile-area');
        const userPhoto = document.getElementById('user-photo');
        const userName = document.getElementById('user-name');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const healthForm = document.getElementById('health-form');
        const inputDate = document.getElementById('input-date');
        const inputTemp = document.getElementById('input-temp');
        const inputSleep = document.getElementById('input-sleep');
        const inputCondition = document.getElementById('input-condition');
        const inputMemo = document.getElementById('input-memo');
        const recordsList = document.getElementById('records-list');
        const deleteModal = document.getElementById('delete-modal');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

        // Set default date to today
        inputDate.value = new Date().toISOString().split('T')[0];

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-slate-800 text-white' : 'bg-red-600 text-white';
            const icon = type === 'success' ? 'fa-check-circle text-emerald-400' : 'fa-triangle-exclamation';

            toast.className = `${bgClass} pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-sm flex items-center gap-2 fade-in`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userName.textContent = user.displayName || 'ユーザー';
                userPhoto.src = user.photoURL || 'https://placehold.co/100x100/22c55e/ffffff?text=User';
                
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                userProfileArea.classList.remove('hidden');
                userProfileArea.classList.add('flex');

                // Start listening to records
                subscribeToRecords(user.uid);
            } else {
                currentUser = null;
                if (unsubscribeRecords) unsubscribeRecords();
                
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                userProfileArea.classList.add('hidden');
                userProfileArea.classList.remove('flex');
            }
        });

        // Google Login Button
        googleLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                showToast('ログインしました');
            } catch (error) {
                console.error("Login error:", error);
                showToast('ログインに失敗しました', 'error');
            }
        });

        // Logout Button
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showToast('ログアウトしました');
            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        function getRecordsCollectionRef(uid) {
            // Using standard artifacts scope fallback for cross-environment stability
            return collection(db, 'artifacts', appId, 'users', uid, 'records');
        }

        function subscribeToRecords(uid) {
            const recordsRef = getRecordsCollectionRef(uid);

            unsubscribeRecords = onSnapshot(recordsRef, (snapshot) => {
                const records = [];
                snapshot.forEach((doc) => {
                    records.push({ id: doc.id, ...doc.data() });
                });

                // Rule 2: Sort descending in JS memory by date
                records.sort((a, b) => new Date(b.date) - new Date(a.date));

                renderRecords(records);
                updateStats(records);
            }, (error) => {
                console.error("Firestore snapshot error:", error);
                showToast('データの読み込みに失敗しました', 'error');
            });
        }

        function renderRecords(records) {
            document.getElementById('record-count-badge').textContent = `${records.length}件`;

            if (records.length === 0) {
                recordsList.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-200">
                        <i class="fa-solid fa-notes-medical text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">まだ記録がありません。左のフォームから入力してください。</p>
                    </div>
                `;
                return;
            }

            recordsList.innerHTML = records.map((record) => {
                const conditionStyles = {
                    '絶好調': { badge: 'bg-emerald-100 text-emerald-800 border-emerald-200', icon: '🌟' },
                    '良い': { badge: 'bg-teal-100 text-teal-800 border-teal-200', icon: '😊' },
                    'ふつう': { badge: 'bg-blue-100 text-blue-800 border-blue-200', icon: '😐' },
                    '悪い': { badge: 'bg-amber-100 text-amber-800 border-amber-200', icon: '😟' },
                    '非常につらい': { badge: 'bg-rose-100 text-rose-800 border-rose-200', icon: '😫' }
                };

                const style = conditionStyles[record.condition] || { badge: 'bg-slate-100 text-slate-800 border-slate-200', icon: '❓' };

                return `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm transition hover:shadow-md space-y-3 relative group">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800 text-base">${record.date}</span>
                                <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${style.badge}">
                                    ${style.icon} ${record.condition}
                                </span>
                            </div>
                            <button onclick="window.openDeleteModal('${record.id}')" class="text-slate-400 hover:text-red-500 p-1.5 rounded-lg transition opacity-80 group-hover:opacity-100">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-sm bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-temperature-half text-red-500 w-4"></i>
                                <span class="text-slate-500 text-xs">体温:</span>
                                <span class="font-semibold text-slate-700">${Number(record.temp).toFixed(1)} ℃</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-bed text-indigo-500 w-4"></i>
                                <span class="text-slate-500 text-xs">睡眠:</span>
                                <span class="font-semibold text-slate-700">${Number(record.sleep).toFixed(1)} 時間</span>
                            </div>
                        </div>

                        ${record.memo ? `
                            <p class="text-xs text-slate-600 bg-white p-2.5 rounded-lg border border-slate-100 whitespace-pre-wrap leading-relaxed">
                                <i class="fa-solid fa-quote-left text-slate-300 mr-1"></i>${record.memo}
                            </p>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateStats(records) {
            if (records.length === 0) {
                document.getElementById('stat-temp').innerHTML = `-- <span class="text-xs font-normal">℃</span>`;
                document.getElementById('stat-sleep').innerHTML = `-- <span class="text-xs font-normal">時間</span>`;
                document.getElementById('stat-count').innerHTML = `0 <span class="text-xs font-normal">日</span>`;
                document.getElementById('stat-condition').textContent = `データなし`;
                return;
            }

            const totalTemp = records.reduce((acc, curr) => acc + Number(curr.temp), 0);
            const totalSleep = records.reduce((acc, curr) => acc + Number(curr.sleep), 0);

            const avgTemp = (totalTemp / records.length).toFixed(1);
            const avgSleep = (totalSleep / records.length).toFixed(1);

            document.getElementById('stat-temp').innerHTML = `${avgTemp} <span class="text-xs font-normal">℃</span>`;
            document.getElementById('stat-sleep').innerHTML = `${avgSleep} <span class="text-xs font-normal">時間</span>`;
            document.getElementById('stat-count').innerHTML = `${records.length} <span class="text-xs font-normal">日</span>`;
            document.getElementById('stat-condition').textContent = `${records[0].condition}`;
        }

        healthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const newRecord = {
                date: inputDate.value,
                temp: parseFloat(inputTemp.value),
                sleep: parseFloat(inputSleep.value),
                condition: inputCondition.value,
                memo: inputMemo.value.trim(),
                createdAt: new Date().toISOString()
            };

            try {
                const recordsRef = getRecordsCollectionRef(currentUser.uid);
                await addDoc(recordsRef, newRecord);

                showToast('健康記録を保存しました！');
                
                // Reset optional fields
                inputTemp.value = '';
                inputSleep.value = '';
                inputMemo.value = '';
                inputCondition.value = '良い';
                inputDate.value = new Date().toISOString().split('T')[0];
            } catch (error) {
                console.error("Error adding record:", error);
                showToast('保存に失敗しました', 'error');
            }
        });

        window.openDeleteModal = (id) => {
            targetDeleteId = id;
            deleteModal.classList.remove('hidden');
            deleteModal.classList.add('flex');
        };

        cancelDeleteBtn.addEventListener('click', () => {
            targetDeleteId = null;
            deleteModal.classList.add('hidden');
            deleteModal.classList.remove('flex');
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!targetDeleteId || !currentUser) return;

            try {
                const recordDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'records', targetDeleteId);
                await deleteDoc(recordDocRef);
                showToast('記録を削除しました');
            } catch (error) {
                console.error("Error deleting record:", error);
                showToast('削除に失敗しました', 'error');
            } finally {
                targetDeleteId = null;
                deleteModal.classList.add('hidden');
                deleteModal.classList.remove('flex');
            }
        });
    </script>
</body>
</html>
